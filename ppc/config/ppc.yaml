# =============================================================================
# PPC 高纯锗探测器配置文件
# 自制 p 型 HPGe，圆柱晶体：直径 30 mm × 高 10 mm
# P+ 点电极在高杂质浓度面（顶面），N+ 包裹侧面 + 底面
# =============================================================================

name: PPC HPGe (custom, dia 30 mm x h 10 mm)

# 输入文件中使用的单位（数值都按这些单位解释）
units:
  length: mm
  angle: deg
  potential: V
  temperature: K

# -----------------------------------------------------------------------------
# 网格（探测器轴对称 -> 用柱坐标 2D 求解，速度比 3D 快 ~100 倍）
# r / z 范围比晶体稍大，给开放边界留余量
# phi 起止都设 0 = 不沿 phi 离散，启用 phi 对称
# 边界 boundaries: inf -> 远场近似（半无限大空间）
# -----------------------------------------------------------------------------
grid:
  coordinates: cylindrical
  axes:
    r:
      to: 18                  # 晶体半径 15 mm + 3 mm 余量
      boundaries: inf
    phi:
      from: 0
      to: 0
      boundaries: periodic
    z:
      from: -2                # 晶体底面是 z=0，往下 2 mm 余量
      to: 12                  # 晶体顶面是 z=10，往上 2 mm 余量
      boundaries:
        left: inf
        right: inf

medium: vacuum

# -----------------------------------------------------------------------------
# 探测器定义：半导体 + 电极
# -----------------------------------------------------------------------------
detectors:
  - semiconductor:
      material: HPGe
      temperature: 78         # 工作温度 78 K（液氮）

      # 杂质浓度（acceptor 净浓度）沿 z 方向线性分布
      # 晶体范围 z=0 (底, N+ 面, |N_A|低)  到  z=10 (顶, P+ 面, |N_A|高)
      # 用户数据：底面 0.28e10 /cm^3 = 2.8e6 /mm^3
      #          顶面 0.30e10 /cm^3 = 3.0e6 /mm^3
      # SSD 约定：p 型材料 -> 杂质浓度取负值
      # 线性模型：rho(z) = offset + grad_z * z
      #   z=0  :  rho = -2.8e6              -> 对应底面 0.28e10 /cm^3
      #   z=10 :  rho = -2.8e6 + 10 * (-2e4) = -3.0e6  -> 对应顶面 0.30e10 /cm^3
      impurity_density:
        name: linear
        offset: -2.8e6        # 单位 mm^-3 (= -0.28e10 cm^-3)
        gradient:
          z: -2.0e4           # 单位 mm^-4，让浓度从底面 -2.8e6 线性增到顶面 -3.0e6

      # 载流子漂移模型（信号仿真用，电势/电场计算时不影响）
      charge_drift_model:
        include: ADLChargeDriftModel/drift_velocity_config.yaml

      # 晶体几何：圆柱 tube，半径 15 mm，高 10 mm
      # origin.z = 5 表示圆柱中心 z = 5，因此 z 范围是 0~10
      geometry:
        tube:
          r: 15
          h: 10
          origin:
            z: 5

    contacts:
      # ---------------------------------------------------------------
      # 接触电极 1：P+ 点电极
      #   位置  ：晶体顶面 (z=10)，杂质浓度高的一侧
      #   形状  ：直径 8 mm 圆盘（r=4 mm）
      #   电位  ：0 V (接地)
      #   h=0   ：零厚度，相当于贴在表面的金属化层
      # ---------------------------------------------------------------
      - material: HPGe
        id: 1
        potential: 0
        geometry:
          tube:
            r: 4
            h: 0
            origin:
              z: 10

      # ---------------------------------------------------------------
      # 接触电极 2：N+ 包裹电极（侧面 + 底面）
      #   电位  ：在此 YAML 中初值给 2000 V（任务 1 用，需要过偏压保证完全耗尽，
      #          因为 estimate_depletion_voltage 要求初始仿真已经全耗尽）
      #          任务 2 中代码会动态改成 1000 V
      #   由两片 tube 的并集组成：
      #     - 底面圆盘：r=15, h=0, z=0
      #     - 侧面圆柱壳：r=15..15, h=10, 中心 z=5
      # ---------------------------------------------------------------
      - material: HPGe
        id: 2
        potential: 2000
        geometry:
          union:
            - tube:                     # 底面（N+ 面）
                r: 15
                h: 0
                origin:
                  z: 0
            - tube:                     # 侧面圆柱壳
                r:
                  from: 15
                  to: 15
                h: 10
                origin:
                  z: 5
