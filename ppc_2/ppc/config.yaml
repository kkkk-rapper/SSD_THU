# =============================================================================
# PPC (平行板) 高纯锗探测器 — 配置文件
# =============================================================================
# 用法：编辑此文件后运行 simulate.jl
#   cd ~/Desktop/SSD && julia --project=. ppc/simulate.jl
# =============================================================================

# ---- 基本信息 ----
name: PPC HPGe Detector                   # 探测器名称 (随意取)

# ---- 全局单位 (所有长度/角度/电压/温度都按这里指定的单位解析) ----
units:
  length: mm                              # 长度单位: mm
  angle: deg                              # 角度单位: deg
  potential: V                            # 电压单位: V
  temperature: K                          # 温度单位: K

# =============================================================================
# 计算网格 — 决定空间分辨率和计算量
# =============================================================================
# 全 3D 柱坐标 (偏心划痕必须用 3D，轴对称 2D 会错误地变成环状)
# φ: 0→360° 完整一圈，约 36 个点，计算量约为 2D 的 36 倍
grid:
  coordinates: cylindrical                # 坐标系: cylindrical (柱坐标)
  axes:
    # ---- 径向 r (半径方向) ----
    r:
      to: 20                              #   网格外边界 (mm) = 晶体半径 15 + 余量
      boundaries: inf                     #   外边界条件: inf = 无穷远 (相当于接地)
    # ---- 方位角 φ (环绕方向) ----
    phi:
      from: 0                             #   φ 起点 (度)
      to: 360                             #   φ 终点 = 360° 完整 3D (偏心特征必须)
      boundaries: periodic                #   周期性边界 (0° 和 360° 是同一个点)
    # ---- 轴向 z (高度方向) ----
    z:
      from: -5                            #   z 起点 (mm)，给晶体下方留余量
      to: 20                              #   z 终点 (mm) = 晶体高度 10 + 余量
      boundaries:
        left: inf                         #   下边界条件: 无穷远
        right: inf                        #   上边界条件: 无穷远

# ---- 探测器所在介质 ----
medium: vacuum                            # 真空

# =============================================================================
# 探测器定义
# =============================================================================
detectors:
  - semiconductor:                        # 半导体探测器
      # ---- 材料 & 工作温度 ----
      material: HPGe                      # 高纯锗 (High Purity Germanium)
      temperature: 78                     # 工作温度 (K)，78K ≈ 液氮温度

      # =======================================================================
      # 杂质浓度分布 — 决定耗尽电压和电场形状
      # =======================================================================
      # 线性模型: ρ(z) = offset + gradient.z × z
      #
      # 当前参数 (晶体 h=10mm, 直径=30mm):
      #   底面 z=0:     -0.28 × 10¹⁰ cm⁻³ = -2.8×10⁶ mm⁻³
      #   顶面 z=10mm:  -0.30 × 10¹⁰ cm⁻³ = -3.0×10⁶ mm⁻³
      #   梯度: -20000 mm⁻⁴ (越往上 P 型越浓)
      #
      # ★ P+ 点电极放在杂质浓度高 (-3.0e6) 的一侧 = 顶面 z=10
      #   (与同系列 2D 项目 ppc 保持一致)
      #
      # 配置值单位: mm⁻³ (内部自动转换为 m⁻³)
      # 可选模型: constant / linear / cylindrical / ptype_pn_junction
      impurity_density:
        name: linear                      # 线性分布模型
        offset: -2.8e6                    # ★ z=0 (底面) 杂质浓度，P型，对应 -0.28×10¹⁰ cm⁻³
        gradient:
          z: -20000                       # ★ z 方向梯度，顶面比底面更负 (顶面 -3.0e6)

      # =======================================================================
      # 电荷漂移模型 — 描述电子/空穴在电场中怎么跑 (通常不需要改)
      # =======================================================================
      charge_drift_model:
        model: ADLChargeDriftModel        # 各向异性漂移 (Ge 晶格方向有影响)
        phi110: -45°                      # 晶体 <110> 轴相对坐标系的偏转角
        material: HPGe
        drift:
          velocity:
            model: Bruyneel2006           # Bruyneel & Debertin 2006 年参数化
            parameters:
              e100:                       # 电子沿 <100> 晶向的参数
                mu0: 38609cm^2/(V*s)      #   低电场迁移率
                beta: 0.805               #   饱和指数 (越接近 1 饱和越快)
                E0: 511V/cm               #   临界电场 (超过后进入饱和区)
                mun: -171cm^2/(V*s)       #   饱和区常数项
              e111:                       # 电子沿 <111> 晶向
                mu0: 38536cm^2/(V*s)
                beta: 0.641
                E0: 538V/cm
                mun: 510cm^2/(V*s)
              h100:                       # 空穴沿 <100> 晶向
                mu0: 61824cm^2/(V*s)
                beta: 0.942
                E0: 185V/cm
              h111:                       # 空穴沿 <111> 晶向
                mu0: 61215cm^2/(V*s)
                beta: 0.662
                E0: 182V/cm
        temperature_dependence:           # 温度修正 (工作温度 ≠ 78K 时需要)
          reference_temperature: 78K      #   参考温度
          model: Omar1987
          parameters:
            e: { p: 1.68, theta: 200K }   #   电子迁移率 ∝ T^(-p) · exp(-θ/T)
            h: { p: 2.4,  theta: 200K }   #   空穴迁移率

      # =======================================================================
      # 晶体几何
      # =======================================================================
      # CSG 布尔运算: difference(被减体, 减体)  =  主体 − 划痕
      # 划痕 = 一串重叠小球沿 x 轴排列，每个球的 r 和 origin.z 独立控制
      #
      # 划痕在顶面 (z=10)，每个球从顶面向下侵入晶体：
      #   origin.z = 10   → 半球侵入，侵入深度 = r
      #   origin.z = 10+r → 刚好贴平顶面，深度 = 0
      #   r  → 划痕局部宽度
      geometry:
        difference:
          # ---- 主体: 圆柱晶体 φ30mm × h10mm ----
          - tube:
              r: 15                         #   半径 = 15mm (直径 30mm)
              h: 10                         #   高度 = 10mm
              origin:
                z: 5                        #   中心 z=5 → 底面 z=0, 顶面 z=10

          # ---- 划痕: 3mm 长，位于 p+ 电极上，偏离中心 ----
          # p+ 电极是顶面中心 φ8mm 圆盘，划痕在其中偏心约 1.5mm
          - union:
              - sphere:                     #   x=0.0  浅端
                  r: 0.05
                  origin: { x: 0.0, y: 0.2, z: 10.0 }
              - sphere:                     #   x=0.5  渐深
                  r: 0.10
                  origin: { x: 0.5, y: 0.3, z: 10.0 }
              - sphere:                     #   x=1.0  继续加深
                  r: 0.15
                  origin: { x: 1.0, y: 0.25, z: 10.0 }
              - sphere:                     #   x=1.5  最深点
                  r: 0.20
                  origin: { x: 1.5, y: 0.2, z: 10.0 }
              - sphere:                     #   x=2.0  开始变浅
                  r: 0.15
                  origin: { x: 2.0, y: 0.15, z: 10.0 }
              - sphere:                     #   x=2.5  继续变浅
                  r: 0.10
                  origin: { x: 2.5, y: 0.2, z: 10.0 }
              - sphere:                     #   x=3.0  尾端
                  r: 0.05
                  origin: { x: 3.0, y: 0.25, z: 10.0 }

    # =======================================================================
    # 接触电极
    # =======================================================================
    contacts:
      # ---- 电极 1: n+ (底面 + 整个侧面，加高压) ----
      # 侧面与底面在 r=15, z=0 处连通，是同一个电极
      - material: HPGe
        name: "n+ contact"
        id: 1
        potential: 3500                   # ★ 偏置电压 (V)
        geometry:
          union:
            - tube:                       #   底面 φ30mm 圆盘
                r: 15
                h: 0
                origin:
                  z: 0
            - tube:                       #   侧面 (空心圆柱壳，与底面在 r=15 处连通)
                r:
                  from: 14.9              #     内半径
                  to: 15.1               #     外半径
                h: 10                     #     高度 10mm
                origin:
                  z: 5                    #     中心 z=5，覆盖 z=0→10

      # ---- 电极 2: p+ (顶面 φ8mm 小圆盘 + 划痕内壁，接地) ----
      # p+ 只覆盖顶面中心 φ8mm 区域，其余顶面裸露
      - material: HPGe
        name: "p+ contact"
        id: 2
        potential: 0                      # 接地 = 0V
        geometry:
          union:
            - tube:                       #   顶面 φ8mm 圆盘
                r: 4                      #   半径 = 4mm (直径 8mm)
                h: 0
                origin:
                  z: 10
            - sphere:                     #   划痕球 1 内壁
                r: 0.05
                origin: { x: 0.0, y: 0.2, z: 10.0 }
            - sphere:                     #   划痕球 2 内壁
                r: 0.10
                origin: { x: 0.5, y: 0.3, z: 10.0 }
            - sphere:                     #   划痕球 3 内壁
                r: 0.15
                origin: { x: 1.0, y: 0.25, z: 10.0 }
            - sphere:                     #   划痕球 4 内壁
                r: 0.20
                origin: { x: 1.5, y: 0.2, z: 10.0 }
            - sphere:                     #   划痕球 5 内壁
                r: 0.15
                origin: { x: 2.0, y: 0.15, z: 10.0 }
            - sphere:                     #   划痕球 6 内壁
                r: 0.10
                origin: { x: 2.5, y: 0.2, z: 10.0 }
            - sphere:                     #   划痕球 7 内壁
                r: 0.05
                origin: { x: 3.0, y: 0.25, z: 10.0 }

# =============================================================================
# 周围环境 — 非探测器结构 (如钝化层、低温恒温器、电缆...)
# =============================================================================
surroundings:
  - name: Passivation Layer               # 顶面裸露区的表面钝化层
    # 真实 PPC: 顶面除 p+ 电极(φ8mm 圆盘)以外的环形区域是裸露锗面，
    # 上面覆盖一层薄钝化膜。建模为紧贴顶面上方的环形薄盘 (r 4→15)。
    # ★ 不设 potential → 浮空(floating)。钝化层是绝缘膜，不是接地电极；
    #   若写 potential:0 会把它当成一个接地区域，属于建模错误。
    material: HPGe                         # 钝化面材料 (SSD 官方示例的 Passivated Surface 同样用 HPGe)
    geometry:
      tube:                               # 顶面环形薄盘
        r:
          from: 4                         #   内半径 = p+ 电极边缘 (r=4mm)
          to: 15                          #   外半径 = 晶体边缘 (r=15mm)
        h: 0.1                            #   厚度 0.1mm (钝化膜很薄)
        origin:
          z: 10.05                        #   占据 z=10→10.1，紧贴顶面裸露区，不与晶体/电极重叠
    charge_density:                       # 钝化面固定电荷 (表面电荷效应)
      name: constant                      #   均匀分布
      value: 0C/m^3                       #   0 = 无固定电荷 (可设为非零模拟表面电荷效应)
